<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign Up · Little Oak Montessori</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <a class="logo" href="index.html" style="margin:0;">
                    <img src="logo.png" alt="Little Oak Montessori" class="logo-img">
                    <span>LITTLE OAK<br><small>MONTESSORI</small></span>
                </a>
                <div style="display:flex;gap:6px;">
                    <button class="toggle-rtl" data-rtl title="Toggle RTL/LTR">RTL</button>
                    <button class="toggle" data-theme>🌙</button>
                </div>
            </div>
            <div class="auth-tabs">
                <a href="login.html" class="auth-tab">Log In</a>
                <a href="signup.html" class="auth-tab active">Sign Up</a>
            </div>
            <div class="eyebrow">New Family Registration</div>
            <h1 style="font-size:36px;margin:10px 0 16px;">Create Account</h1>
            <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Register to manage admissions, book campus visits, and access family resources.</p>
            <form class="form" onsubmit="event.preventDefault();location.href='dashboard.html'">
                <label>Full Name
                    <input type="text" required placeholder="Ananya Sharma">
                </label>
                <label>Email Address
                    <input type="email" required placeholder="parent@example.com">
                </label>
                <label>Password
                    <div class="password-field">
                        <input type="password" id="signup-password" required placeholder="Create password">
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('signup-password', this)">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </label>
                <label>Confirm Password
                    <div class="password-field">
                        <input type="password" id="signup-confirm-password" required placeholder="Confirm password">
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('signup-confirm-password', this)">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </label>
                <div style="margin:4px 0 10px;">
                    <label style="font-weight:normal;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" required style="width:auto;margin:0;">
                        <span>I agree to the <a href="#" style="color:var(--sage);font-weight:700;text-decoration:underline;">Terms & Conditions</a> and <a href="#" style="color:var(--sage);font-weight:700;text-decoration:underline;">Privacy Policy</a></span>
                    </label>
                </div>
                <button class="btn" style="width:100%;margin-top:6px;">Create Family Account</button>
            </form>
            <div class="auth-divider">
                <span>Or continue with</span>
            </div>
            <div class="social-logins">
                <button type="button" class="btn soft social-btn" onclick="location.href='dashboard.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    <span>Google</span>
                </button>
                <button type="button" class="btn soft social-btn" onclick="location.href='dashboard.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    <span>Facebook</span>
                </button>
                <button type="button" class="btn soft social-btn" onclick="location.href='dashboard.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.67-.82 1.13-1.96.99-3.1-.98.04-2.17.65-2.87 1.47-.62.72-1.16 1.88-1.01 2.99 1.1.09 2.22-.54 2.89-1.36z"/></svg>
                    <span>Apple</span>
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
